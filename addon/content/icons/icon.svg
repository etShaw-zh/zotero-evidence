<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2E6FB8"/>
      <stop offset="100%" stop-color="#123A6B"/>
    </linearGradient>
  </defs>

  <rect x="3" y="3" width="90" height="90" rx="22" fill="url(#bg)"/>

  <!-- document card -->
  <rect x="17" y="15" width="43" height="57" rx="5" fill="#FFFFFF"/>
  <!-- folded corner -->
  <polygon points="48,15 60,15 60,27" fill="#CBDCF2"/>

  <!-- text lines -->
  <line x1="23" y1="29" x2="54" y2="29" stroke="#AFC7E6" stroke-width="3.4" stroke-linecap="round"/>
  <line x1="23" y1="38" x2="54" y2="38" stroke="#AFC7E6" stroke-width="3.4" stroke-linecap="round"/>
  <line x1="23" y1="47" x2="47" y2="47" stroke="#AFC7E6" stroke-width="3.4" stroke-linecap="round"/>

  <!-- magnifying glass handle -->
  <line x1="69.5" y1="73.5" x2="81" y2="85" stroke="#F2B705" stroke-width="6.5" stroke-linecap="round"/>

  <!-- magnifying glass lens -->
  <circle cx="58" cy="62" r="16.5" fill="#FFFFFF" stroke="#F2B705" stroke-width="5.2"/>

  <!-- checkmark inside lens -->
  <polyline points="51,62 56,67.5 66,54.5" fill="none" stroke="#1FA65A" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
